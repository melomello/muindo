<!doctype html>
<html lang="ko">
<head>
  <!-- 구글 로그인 창과 같은 주소에서 열어야 아이폰에서 로그인이 막히지 않습니다. 옛 주소로 오면 새 주소로 보냅니다 -->
  <script>if(/github\.io$|\.web\.app$/.test(location.hostname)) location.replace('https://muindo-a6522.firebaseapp.com/' + location.search + location.hash);</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>무인도 키우기</title>
<!-- 홈 화면에 추가했을 때 앱처럼 보이게 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="무인도">
<meta name="theme-color" content="#cdbd92">
<link rel="preload" href="./fonts/yeop.ttf" as="font" type="font/ttf" crossorigin>
  <script type="module" crossorigin src="./assets/index-DUyMNdIb.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BSSbZXIn.css">
</head>
<body>
<div id="app">
  <!-- 섬 그림이 화면 전체를 채웁니다. 떠오르는 숫자와 말풍선도 여기에 붙습니다 -->
  <div id="stage"></div>
  <!-- 섬 건물 위에 뜨는 알림과 건물 메뉴 -->
  <div id="marks"></div>
  <div id="bmenu" hidden></div>
  <!-- 가장자리 정보와 버튼 -->
  <div id="hud">
    <div id="hud-top">
      <button id="chip" title="내 섬"><span class="badge" hidden></span><span class="face"></span><span class="who"><b id="isle-name"></b><small id="olv"></small><i><s></s></i></span></button>
      <div id="hint" hidden><b>📌</b><em></em><span></span><i>▶</i></div>
      <div id="chbar" hidden><b></b><span></span><button>포기</button></div>
      <div id="homebar" hidden><span></span><button id="homefurn">🪑 가구</button><button id="homeinv">💌 초대</button><button id="homeout">나가기</button></div>
      <button id="resbar" title="자원 모두 보기"><span class="rc money"><i>🐚</i><b id="money">0</b><small id="ips">+0/초</small><em id="mstat"></em></span><span id="res"></span></button>
    </div>
    <div id="hud-left">
      <button id="missionbtn" class="hb" title="미션"><span class="ic">📜</span><span class="lb">미션</span><span class="badge" hidden></span></button>
      <div id="evpill" hidden></div>
      <button id="duelbtn" hidden>🎮 같이 놀기</button>
    </div>
    <div id="toasts"></div>
    <div id="zoombtns"><button id="zin" title="확대">＋</button><button id="zout" title="축소">－</button><button id="zfit" title="섬 가운데로">⌖</button></div>
    <div id="hud-bl">
      <button id="mapbtn" class="hb big" title="항해"><span class="ic">⛵</span><span class="lb">항해</span><span class="badge" hidden></span></button>
    </div>
    <div id="hud-bc">
      <button id="friendbtn" class="hb" title="친구"><span class="ic">👫</span><span class="lb">친구</span></button>
      <button id="fishbtn" class="hb" title="놀이"><span class="ic">🎮</span><span class="lb">놀이</span><span class="badge" hidden></span></button>
      <button id="homebtn" hidden></button>
    </div>
    <!-- 오른쪽 아래: 발전이 가장 크고, 옆으로 동료, 생활, 장식 -->
    <div id="hud-br">
      <button id="decobtn" class="hb" title="장식"><span class="ic">🎨</span><span class="lb">장식</span></button>
      <button id="lifebtn" class="hb" title="생활"><span class="ic">🌱</span><span class="lb">생활</span><span class="badge" hidden></span></button>
      <button id="crewbtn" class="hb" title="동료"><span class="ic">🧑‍🌾</span><span class="lb">동료</span><span class="badge" hidden></span></button>
      <button id="buildbtn" class="hb build" title="발전"><span class="ic">📈</span><span class="lb">발전</span><span class="badge" hidden></span></button>
    </div>
    <div id="modebar" hidden><span></span><button class="mx" id="modeflip" hidden>↔ 뒤집기</button><button class="mx" id="modestore" hidden>📦 보관함</button><button id="modestop">그만</button></div>
    <div id="respop" hidden></div>
    <div id="visitcard" hidden></div>
  </div>
  <!-- 오른쪽에서 밀려 나오는 서랍. 왼쪽 세로 줄에서 탭을 고릅니다 -->
  <aside id="drawer" aria-hidden="true">
    <button id="drawerclose" title="닫기">✕</button>
    <nav>
      <button data-tab="build" class="on"><span class="ic">🏗️</span><span class="lb">건물</span></button>
      <button data-tab="island"><span class="ic">⬆️</span><span class="lb">강화</span></button>
      <button data-tab="crew"><span class="ic">🧑‍🌾</span><span class="lb">동료</span><span class="badge" hidden></span></button>
      <button data-tab="life"><span class="ic">🌱</span><span class="lb">생활</span><span class="badge" hidden></span></button>
      <button data-tab="deco"><span class="ic">🎨</span><span class="lb">장식</span></button>
      <button data-tab="book"><span class="ic">📖</span><span class="lb">도감</span><span class="badge" hidden></span></button>
      <hr>
      <button data-tab="mission"><span class="ic">📜</span><span class="lb">미션</span><span class="badge" hidden></span></button>
      <button data-tab="sail"><span class="ic">⛵</span><span class="lb">항해</span><span class="badge" hidden></span></button>
      <button data-tab="friends"><span class="ic">👫</span><span class="lb">친구</span></button>
      <button data-tab="me" hidden></button>
    </nav>
    <div id="panel"></div>
  </aside>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="guide"></div>
</body>
</html>
